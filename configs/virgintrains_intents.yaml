# DRAFT candidate taxonomy for VirginTrains. NOT ground truth. Generated by scripts/generate_taxonomy.py.
taxonomy:
  brand: VirginTrains
  registry_schema_version: 2
  status: CANDIDATE_NOT_GROUND_TRUTH
  warning: Discovered by unsupervised clustering of opening messages and curated by hand once. NOT yet calibrated
    against human labels. Run scripts/finalize_taxonomy.py after the taxonomy calibration set has been labelled.
    Every field marked NEEDS_REVIEW (including safe_to_auto_handle on every intent) must be reviewed by a human
    before use. Clusters were fit on train+dev only; examples come from the train split only.
  calibration:
    status: NOT_YET_CALIBRATED
    set: golden_pool_reserve
    labelled_cases: 0
  examples_source_split: train_retrieval
