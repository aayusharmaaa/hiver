  - name: service_status_delay_enquiry
    status: candidate_NEEDS_REVIEW
    definition: Customer asks whether a service is running, delayed, or cancelled, or asks for an update on a delay
      they are currently experiencing. Merged from three clusters whose customer goal and agent replies are indistinguishable
      in the data.
    inclusion_criteria:
    - Asks whether a named train or service is running, delayed, or cancelled, or when it will depart or arrive.
    - Asks for news or an update while currently delayed, waiting, or stuck.
    - Asks how announced disruption (engineering works, flooding, strikes) affects travel today.
    exclusion_criteria:
    - Asks about Delay Repay, a refund, or compensation (use delay_repay_refund_claim).
    - Reports or vents about a disrupted journey with no question (use journey_disruption_complaint).
    - Asks whether a ticket is valid on a different train (use ticket_booking_query).
    source_clusters:
    - cluster_id: 2
      name: delay_in_progress_report
    - cluster_id: 9
      name: service_status_update_request
    - cluster_id: 1
      name: service_running_enquiry
    n_cases: 4251
    pct_resolved: 0.182
    pct_dm_redirect: 0.016
    positive_examples:
